services:
  - type: web
    name: true-mobster
    runtime: node
    plan: free
    region: virginia
    branch: main
    repo: https://github.com/taedetta/True-Mobster
    buildCommand: npm install && npm run install:all && cd client && npm install --include=dev && cd .. && THUMBNAIL_AI=0 npm run generate-thumbnails && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: true-mobster-db
          property: connectionString

databases:
  - name: true-mobster-db
    plan: free
    region: virginia
